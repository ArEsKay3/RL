<!doctype html>
<html><head><meta charset="utf-8"><title>SWE dump browser</title>
<style>
:root{--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e1;--zebra:#f3f2ef;--surf:#fcfcfb;--blue:#2a78d6;--good:#0ca30c;--bad:#d03b3b;--warn:#fab219;--orange:#eb6834}
body{font-family:Helvetica,Arial,sans-serif;font-size:13px;color:var(--ink);background:var(--surf);margin:0}
header{display:flex;gap:14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--grid);background:#fff;position:sticky;top:0;z-index:5}
header a{color:var(--blue);text-decoration:none}
header input{width:320px;padding:4px 6px;border:1px solid var(--grid);border-radius:4px}
#crumbs{color:var(--ink2)} #crumbs a{color:var(--blue);text-decoration:none}
main{padding:10px 14px}
table{border-collapse:collapse;width:100%} th,td{padding:3px 8px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:top;white-space:nowrap}
th{position:sticky;top:41px;background:#fff;cursor:pointer;color:var(--ink2);font-weight:600} th.on{color:var(--ink)}
tr:nth-child(even) td{background:var(--zebra)} tr.click{cursor:pointer} tr.click:hover td{background:#e8f0fb}
.num{text-align:right;font-family:monospace} .mono{font-family:monospace}
.badge{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;color:#fff;margin-right:4px}
.b-good{background:var(--good)} .b-bad{background:var(--bad)} .b-warn{background:var(--warn);color:#000} .b-grey{background:#8a8985} .b-blue{background:var(--blue)}
pre{white-space:pre-wrap;word-break:break-word;font-family:Menlo,Consolas,monospace;font-size:12px;background:#fff;border:1px solid var(--grid);border-radius:4px;padding:8px;margin:4px 0;max-height:70vh;overflow:auto}
.card{border:1px solid var(--grid);border-radius:6px;margin:8px 0;background:#fff}
.card>.hd{padding:6px 10px;cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap} .card>.hd:hover{background:#f6f9fd}
.card>.bd{display:none;padding:6px 10px;border-top:1px solid var(--grid)} .card.open>.bd{display:block} .card.deep{border-left:4px solid #4a3aa7}
.bar{display:inline-block;height:9px;background:var(--blue);vertical-align:middle;border-radius:2px}
button,select{padding:3px 8px;border:1px solid var(--grid);background:#fff;border-radius:4px;cursor:pointer;font-size:12px} button:hover{background:#f0f0ee}
.tabs{display:flex;gap:4px;margin:10px 0} .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;margin:6px 0} .kv div:nth-child(odd){color:var(--ink2)}
.tree ul{list-style:none;margin:0;padding-left:18px} .tree li{margin:1px 0} .tree .k{color:#4a3aa7} .tree .s{color:#008300} .tree .n{color:#e34948} .tree .t{cursor:pointer;color:var(--ink2);user-select:none}
.small{color:var(--ink2);font-size:11px} .prog{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;width:320px;display:inline-block;vertical-align:middle} .prog>div{height:100%;background:var(--blue)}
.filters{display:flex;gap:10px;align-items:center;margin:6px 0 10px;flex-wrap:wrap} .filters input{padding:3px 6px;border:1px solid var(--grid);border-radius:4px}
h2{font-size:16px;margin:6px 0} h3{font-size:14px;margin:12px 0 4px}
</style></head><body>
<header><a href="#/"><b>SWE dump browser</b></a><span id="crumbs"></span><span style="flex:1"></span>
<input id="search" placeholder="search indexed files: instance_id, sample_id, group_id, prompt_idx  (Enter)"></header>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s); const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtB=b=>b>1e9?(b/1e9).toFixed(1)+" GB":b>1e6?(b/1e6).toFixed(1)+" MB":b>1e3?(b/1e3).toFixed(0)+" kB":b+" B";
const fmtT=t=>t?new Date(t*1000).toLocaleString():""; const num=v=>v==null?"":typeof v==="number"?v.toLocaleString():esc(v);
async function api(p,q){const u=new URL(p,location.origin);for(const[k,v]of Object.entries(q||{}))if(v!=null&&v!=="")u.searchParams.set(k,v);const r=await fetch(u);const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
function crumbs(parts){$("#crumbs").innerHTML=parts.map(([t,h])=>h?`<a href="${h}">${esc(t)}</a>`:esc(t)).join(" › ")}
function route(){const h=location.hash.replace(/^#\/?/,"");const p=h.split("/").map(decodeURIComponent);
 if(!h)return viewRuns(); if(p[0]==="search")return viewSearch(p[1]||"");
 if(p[0]==="run"&&p.length===2)return viewFiles(p[1]); if(p[0]==="run"&&p[2]==="file"&&p.length===4)return viewRecords(p[1],p[3]);
 if(p[0]==="run"&&p[2]==="file"&&p[4]==="rec")return viewRecord(p[1],p[3],parseInt(p[5])); $("#main").innerHTML="not found"}
window.addEventListener("hashchange",route); window.addEventListener("load",route);
$("#search").addEventListener("keydown",e=>{if(e.key==="Enter")location.hash="#/search/"+encodeURIComponent(e.target.value)});
const st={sort:"i",desc:false,page:0,filter:"",reward:"any",truncated:"any",error:"any",loop:"any",mask:"any"};
const fmtN=v=>v==null?"":Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=1?v.toFixed(2):Math.abs(v)>=0.01?v.toFixed(3):v===0?"0":v.toPrecision(2);
const signed=v=>v==null?"":`<span style="color:${v>0?"#4a3aa7":v<0?"var(--orange)":"inherit"}">${v>0?"+":""}${fmtN(v)}</span>`;
function maskBadge(r){let b="";if(r.in_X_mask_rank!=null)b+=`<span class="badge" style="background:#4a3aa7" title="rank in the chain X mask list: rewarded rollouts with a deep turn, chain G steps 1-10, sorted by |adv| x live deep (1-p)">X #${r.in_X_mask_rank}</span>`;if(r.in_Y_mask_rank!=null)b+=`<span class="badge b-grey" title="rank in the chain Y control list: random rewarded rollouts without a deep turn">Y #${r.in_Y_mask_rank}</span>`;if(r.in_Z_mask_rank!=null)b+=`<span class="badge" style="background:var(--orange)" title="rank in the chain Z mask list: punished rollouts with a deep turn, chain M steps 1-10">Z #${r.in_Z_mask_rank}</span>`;if(r.trained===false)b+=`<span class="badge b-grey" title="no row in the trainer metrics for this step: the rollout was not trained (earlier attempt before a segment restart)">untrained</span>`;return b}
const METRIC_NOTE='Trainer metrics joined from analysis/datadiff/browser (arm-local, compare within the arm): <b>mask X / mask Z</b> = |adv| × Σ(1−p<sub>trainer</sub>) over think tokens beyond position 4096 (X for rewarded, Z for punished rollouts; the ranking that built the chain X and chain Z mask lists); <b>R_deep contrib</b> = adv × that sum, + reinforces deep thinking, − suppresses it; <b>1−p deep</b> ≈ 0.005 means a loop, 0.10–0.15 live reasoning; <b>group net</b> and <b>cancel</b> (= |neg| / pos) are over the 16 siblings of the prompt.';
async function viewRuns(){crumbs([["runs"]]);const runs=await api("/api/runs");
 $("#main").innerHTML=`<h2>Runs with rollout dumps (${runs.length})</h2><table><tr><th>arm</th><th>run</th><th class=num>files</th><th class=num>size</th><th>latest write</th></tr>`+
 runs.map(r=>`<tr class=click onclick="location.hash='#/run/${encodeURIComponent(r.name)}'"><td>${r.label?`<span class="badge b-blue">${esc(r.arm)}</span>${esc(r.label)}`:'<span class=small>unlabelled</span>'}${r.metrics_steps?` <span class=small>· trainer metrics for ${r.metrics_steps} steps</span>`:""}</td><td class=mono>${esc(r.name)}</td><td class=num>${r.n_files}</td><td class=num>${fmtB(r.total_bytes)}</td><td>${fmtT(r.latest_mtime)}</td></tr>`).join("")+"</table>"}
async function viewFiles(run){crumbs([["runs","#/"],[run]]);const files=await api("/api/files",{run});
 $("#main").innerHTML=`<h2 class=mono>${esc(run)}</h2><p class=small>One file per target step (file number = 0-based target step; training step = number + 1). Click a file to index it and list its rollouts; indexing reads the whole file once (~1 min for 10 GB) and is cached.</p>
 <table><tr><th>file</th><th class=num>train step</th><th class=num>size</th><th>written</th><th>index</th></tr>`+
 files.map(f=>`<tr class=click onclick="location.hash='#/run/${encodeURIComponent(run)}/file/${encodeURIComponent(f.name)}'"><td class=mono>${esc(f.name)}</td><td class=num>${f.train_step??""}</td><td class=num>${fmtB(f.size)}</td><td>${fmtT(f.mtime)}</td><td>${f.indexed?`<span class="badge b-good">indexed</span>${f.n_records!=null?f.n_records+" rollouts":""}`:'<span class="badge b-grey">not indexed</span>'}${f.status&&f.status.state==="running"?" indexing…":""}${f.has_metrics?' <span class="badge" style="background:#4a3aa7">metrics</span>':""}</td></tr>`).join("")+"</table>"}
function loopBadge(r){let b="";if(r.loop_turns)b+=`<span class="badge b-bad" title="${r.loop_turns} reasoning block(s) of 1,000+ tokens with zlib ratio < 0.10; ${num(r.loop_tokens)} tokens">loop ×${r.loop_turns}</span>`;if(r.runaway)b+=`<span class="badge" style="background:var(--orange)" title="rollout truncated and its last turn never reached a tool call">runaway</span>`;return b}
function badges(r){let b="";if(r.reward!=null)b+=`<span class="badge ${r.reward>0?"b-good":"b-bad"}">reward ${r.reward}</span>`;if(r.truncated)b+=`<span class="badge b-warn">truncated</span>`;if(r.agent_error_kind)b+=`<span class="badge b-bad">${esc(r.agent_error_kind)}</span>`;if(r.resolved===true&&!(r.reward>0))b+=`<span class="badge b-grey">resolved</span>`;return b}
async function viewRecords(run,file){crumbs([["runs","#/"],[run,"#/run/"+encodeURIComponent(run)],[file]]);const m=$("#main");
 m.innerHTML=`<h2 class=mono>${esc(run)} / ${esc(file)}</h2><div id=status></div><div id=tbl></div>`;
 const BASE=[["i","#",r=>r.i,1],["sample_id","sample",r=>`<span class=mono title="${esc(r.sample_id)}">${esc((r.sample_id||"").slice(0,8))}…${esc((r.sample_id||"").slice(-3))}</span>`],["instance_id","instance",r=>`<span class=mono>${esc(r.instance_id)}</span>`],["prompt_idx","prompt",r=>num(r.prompt_idx),1],["completion_index","comp",r=>num(r.completion_index),1],["reward","reward",r=>badges({reward:r.reward})],["resolved","resolved",r=>r.resolved===true?"✓":r.resolved===false?"✗":""],["truncated","trunc",r=>r.truncated?'<span class="badge b-warn">yes</span>':""],["agent_error_kind","error",r=>r.agent_error_kind?`<span class="badge b-bad">${esc(r.agent_error_kind)}</span>`:""],["loop_turns","loops",r=>loopBadge(r)],["loop_pct","loop %",r=>r.loop_pct!=null&&r.loop_pct>0?r.loop_pct.toFixed(1):"",1],["min_zlib","min zlib",r=>r.min_zlib!=null?`<span style="${r.min_zlib<0.10?"color:var(--bad);font-weight:700":""}">${r.min_zlib.toFixed(2)}</span>`:"",1],["max_turn_tokens","max turn tok",r=>num(r.max_turn_tokens),1],["num_assistant_turns","turns",r=>num(r.num_assistant_turns),1],["generation_length","gen tokens",r=>num(r.generation_length),1],["total_tokens","total tokens",r=>num(r.total_tokens),1],["start_weight_version","wv start",r=>num(r.start_weight_version),1],["end_weight_version","wv end",r=>num(r.end_weight_version),1],["bytes","bytes",r=>fmtB(r.bytes),1]];
 async function load(){const q={run,file,sort:st.sort,desc:st.desc?1:0,offset:st.page*100,limit:100,filter:st.filter,reward:st.reward,truncated:st.truncated,agent_error_kind:st.error,loop:st.loop,mask:st.mask};
  const d=await api("/api/records",q);const s=d.status;
  if(s.state==="running"||(!d.rows.length&&s.state!=="error"&&s.n_records===0)){const ph=s.phase==="summarize"?`summarizing rollouts ${s.done} / ${s.total}`:`scanning ${fmtB(s.done)} / ${fmtB(s.total||s.size_now)}`;$("#status").innerHTML=`<p>indexing: ${ph} <span class=prog><div style="width:${s.total?100*s.done/s.total:0}%"></div></span> ${s.n_summarized} of ${s.n_records} rollouts ready</p>`;setTimeout(load,2000);if(!d.rows.length)return}
  else if(s.state==="error")$("#status").innerHTML=`<p style="color:var(--bad)">index error: ${esc(s.error)}</p>`;
  else if(s.version!==2)$("#status").innerHTML=`<p class=small>${s.n_records} rollouts indexed with an older index (no loop columns) — <a href="#" onclick="reindex(event,'${esc(run)}','${esc(file)}')">re-index</a></p>`;
  else $("#status").innerHTML=`<p class=small>${s.n_records} rollouts indexed (${fmtB(s.size_indexed)}${s.size_now>s.size_indexed?`; file has grown by ${fmtB(s.size_now-s.size_indexed)} since — <a href="#" onclick="reindex(event,'${esc(run)}','${esc(file)}')">re-index</a>`:""})</p>`+(d.has_metrics?`<p class=small>${METRIC_NOTE}</p>`:"");
  const rankKey=d.arm==="M"?"in_Z_mask_rank":"in_X_mask_rank";
  const METRIC=[[rankKey,"mask list",r=>maskBadge(r)],["adv","adv",r=>fmtN(r.adv),1],["mask_metric_X","mask X",r=>fmtN(r.mask_metric_X),1],["mask_metric_Z","mask Z",r=>fmtN(r.mask_metric_Z),1],["r_deep_contrib","R_deep contrib",r=>signed(r.r_deep_contrib),1],["mean_1mp_deep","1−p deep",r=>r.mean_1mp_deep!=null?r.mean_1mp_deep.toFixed(3):"",1],["n_deep_turns","deep turns",r=>r.n_deep_turns?r.n_deep_turns:"",1],["group_net_contrib","group net",r=>signed(r.group_net_contrib),1],["group_cancel_ratio","cancel",r=>r.group_cancel_ratio!=null?fmtN(r.group_cancel_ratio):"",1]];
  const cols=d.has_metrics?[...BASE.slice(0,13),...METRIC,...BASE.slice(13)]:BASE;
  const pages=Math.ceil(d.n/100);
  $("#tbl").innerHTML=`<div class=filters><input id=f placeholder="text filter (any field)" value="${esc(st.filter)}"> reward <select id=fr>${["any","1.0","0.0"].map(v=>`<option ${st.reward===v?"selected":""}>${v}</option>`).join("")}</select> truncated <select id=ft>${["any","true","false"].map(v=>`<option ${st.truncated===v?"selected":""}>${v}</option>`).join("")}</select> error <select id=fe>${["any","None","max_iteration","context_window","stuck_in_loop","other"].map(v=>`<option ${st.error===v?"selected":""}>${v}</option>`).join("")}</select> loops <select id=fl>${[["any","any"],["loop","with repetitive turn"],["runaway","runaway (truncated, no tool call)"],["none","none"]].map(([v,l])=>`<option value="${v}" ${st.loop===v?"selected":""}>${l}</option>`).join("")}</select>${d.has_metrics?` mask list <select id=fm>${[["any","any"],["X","in X list"],["Y","in Y list"],["Z","in Z list"],["deep","has deep turn"],["trained","trained"],["untrained","untrained"]].map(([v,l])=>`<option value="${v}" ${st.mask===v?"selected":""}>${l}</option>`).join("")}</select>`:""} <span class=small>${d.n} match · page ${st.page+1}/${pages||1}</span> <button id=prev>‹</button><button id=next>›</button></div>
  <table><tr>${cols.map(([k,l])=>`<th class="${st.sort===k?"on":""}" data-k="${k}">${l}${st.sort===k?(st.desc?" ▼":" ▲"):""}</th>`).join("")}</tr>`+
  d.rows.map(r=>`<tr class=click onclick="location.hash='#/run/${encodeURIComponent(run)}/file/${encodeURIComponent(file)}/rec/${r.i}'">${cols.map(([k,l,f,n])=>`<td${n?' class=num':""}>${f(r)}</td>`).join("")}</tr>`).join("")+"</table>";
  document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.sort===k)st.desc=!st.desc;else{st.sort=k;st.desc=!(k==="i"||k.endsWith("_rank")||k==="sample_id"||k==="instance_id")}st.page=0;load()});
  $("#f").onchange=e=>{st.filter=e.target.value;st.page=0;load()};$("#fr").onchange=e=>{st.reward=e.target.value;st.page=0;load()};$("#ft").onchange=e=>{st.truncated=e.target.value;st.page=0;load()};$("#fe").onchange=e=>{st.error=e.target.value;st.page=0;load()};$("#fl").onchange=e=>{st.loop=e.target.value;st.page=0;load()};const fm=$("#fm");if(fm)fm.onchange=e=>{st.mask=e.target.value;st.page=0;load()};
  $("#prev").onclick=()=>{if(st.page>0){st.page--;load()}};$("#next").onclick=()=>{if(st.page<pages-1){st.page++;load()}}}
 load()}
async function reindex(e,run,file){e.preventDefault();await api("/api/index",{run,file,start:1});viewRecords(run,file)}
let cur=null;
async function viewRecord(run,file,i){cur={run,file,i};crumbs([["runs","#/"],[run,"#/run/"+encodeURIComponent(run)],[file,`#/run/${encodeURIComponent(run)}/file/${encodeURIComponent(file)}`],["rollout "+i]]);
 const m=$("#main");m.innerHTML="loading…";const d=await api("/api/record",{run,file,i});const r=d.record;const fr=r.full_result||{};const pm=r.prompt_metadata||{};
 const base=`#/run/${encodeURIComponent(run)}/file/${encodeURIComponent(file)}/rec/`;
 m.innerHTML=`<div style="display:flex;gap:10px;align-items:center"><h2>rollout ${i} <span class=small>of ${d.n}</span></h2><button onclick="location.hash='${base}${Math.max(0,i-1)}'">‹ prev (k)</button><button onclick="location.hash='${base}${Math.min(d.n-1,i+1)}'">next (j) ›</button><span style="flex:1"></span><a href="/api/raw?run=${encodeURIComponent(run)}&file=${encodeURIComponent(file)}&i=${i}">download raw json</a></div>
 <div>${badges({reward:r.reward,truncated:r.truncated,agent_error_kind:fr.agent_error_kind,resolved:fr.resolved})}${fr.patch_exists===false?'<span class="badge b-grey">no patch</span>':""}${loopBadge(d.loop||{})}${d.loop&&d.loop.min_zlib!=null?`<span class=small> min zlib ${d.loop.min_zlib.toFixed(2)} over ${d.loop.long_turns} long turn(s); loop tokens ${num(d.loop.loop_tokens)} (${d.loop.loop_pct??0} % of generated)</span>`:""}</div>
 ${d.has_metrics?`<div style="margin-top:4px">${maskBadge({...(d.metrics||{}),trained:d.trained})}${d.metrics?`<span class=small>adv ${fmtN(d.metrics.adv)} · R_deep contrib ${signed(d.metrics.r_deep_contrib)} · mask X ${fmtN(d.metrics.mask_metric_X)||"–"} · mask Z ${fmtN(d.metrics.mask_metric_Z)||"–"} · deep turns ${d.metrics.n_deep_turns??0} (${num(d.metrics.deep_think_tokens)} tok, 1−p deep ${d.metrics.mean_1mp_deep!=null?d.metrics.mean_1mp_deep.toFixed(3):"–"}) · group net ${signed(d.metrics.group_net_contrib)} cancel ${fmtN(d.metrics.group_cancel_ratio)||"–"} · trainer mask ${d.metrics.mask_before}→${d.metrics.mask_after} · seq err ${fmtN(d.metrics.seq_mult_prob_error)}</span>`:`<span class=small>trainer metrics exist for this step but not for this rollout: it was not trained</span>`}</div>`:""}
 <div class=kv><div>sample / group</div><div class=mono>${esc(r.sample_id)} &nbsp; <a href="#" onclick="tab('group');return false">group ${esc(r.group_id)}</a> (completion ${esc(r.completion_index)})</div>
 <div>instance</div><div class=mono>${esc(pm.instance_id)} &nbsp; <span class=small>${esc(pm.repo)} · ${esc(pm.dataset_name)} · prompt_idx ${esc(r.prompt_idx)}</span></div>
 <div>step / weights</div><div>target_step ${esc(r.target_step)} (training step ${(r.target_step??-1)+1}) · weight version ${esc(r.start_weight_version)} → ${esc(r.end_weight_version)} · committed ${fmtT(r.committed_at)}</div>
 <div>size</div><div>${num(r.num_assistant_turns)} assistant turns · ${num(r.generation_length)} generated tokens · ${num(r.total_tokens)} total tokens${r.truncated?' · <b>truncated</b>':""}</div>
 <div>timing</div><div>openhands ${fr.openhands_run_time!=null?fr.openhands_run_time.toFixed(0)+" s":""} · model calls ${fr.total_model_call_time!=null?fr.total_model_call_time.toFixed(0)+" s":""} · commands ${fr.total_command_exec_time!=null?fr.total_command_exec_time.toFixed(0)+" s":""} · eval ${fr.final_eval_time!=null?fr.final_eval_time.toFixed(0)+" s":""}${fr.agent_timed_out?" · <b>agent timed out</b>":""}${fr.oom_killed?" · <b>OOM killed</b>":""}</div></div>
 <div class=tabs><button id=t-turns onclick="tab('turns')">turns</button><button id=t-problem onclick="tab('problem')">problem & patch</button><button id=t-fields onclick="tab('fields')">all fields</button><button id=t-group onclick="tab('group')">group (same prompt)</button><button id=t-raw onclick="tab('raw')">raw json</button></div><div id=tab></div>`;
 cur.rec=r;cur.n=d.n;tab("turns")}
document.addEventListener("keydown",e=>{if(!cur||e.target.tagName==="INPUT")return;const base=`#/run/${encodeURIComponent(cur.run)}/file/${encodeURIComponent(cur.file)}/rec/`;if(e.key==="j")location.hash=base+Math.min(cur.n-1,cur.i+1);if(e.key==="k")location.hash=base+Math.max(0,cur.i-1)});
async function tab(name){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.id==="t-"+name));const t=$("#tab");t.innerHTML="loading…";
 if(name==="turns")return tabTurns(t); if(name==="problem")return tabProblem(t); if(name==="fields")return tabFields(t); if(name==="group")return tabGroup(t); if(name==="raw")return tabRaw(t)}
function valueLink(path,label){return `<button onclick="loadValue(this,'${esc(path)}')">${esc(label)}</button>`}
async function loadValue(btn,path){btn.disabled=true;btn.textContent="loading…";const d=await api("/api/value",{run:cur.run,file:cur.file,i:cur.i,path});const pre=document.createElement("pre");pre.textContent=typeof d.value==="string"?d.value:JSON.stringify(d.value,null,1);btn.replaceWith(pre)}
async function tabTurns(t){const d=await api("/api/turns",{run:cur.run,file:cur.file,i:cur.i});const T=d.turns;const P=d.paths;const mx=Math.max(1,...T.map(x=>x.assistant_n_tokens||0));const deep=T.filter(x=>x.deep_tokens>0);
 t.innerHTML=`<div class=small style="margin:6px 0">${T.length} assistant turns. Click a turn to expand. Bar = generated tokens of the turn (max ${num(mx)}). zlib = compression ratio of the reasoning text; &lt; 0.10 on a 1,000+ token block is the repetitive-loop criterion.${d.has_metrics?` Violet border = turn with think tokens beyond position 4096 (deep); contrib = adv × Σ(1−p) over those tokens (adv ${fmtN(d.adv)}).`:""} <button onclick="document.querySelectorAll('.card').forEach(c=>c.classList.add('open'))">expand all</button> <button onclick="document.querySelectorAll('.card').forEach(c=>c.classList.remove('open'))">collapse all</button>${deep.length?`<div style="margin-top:4px"><b>deep turns:</b> ${deep.map(x=>`<a href="#" onclick="openTurn(event,${x.k})">${x.k+1}</a> <span class=small>(${num(x.deep_tokens)} deep tok, contrib ${signed(x.turn_contrib)})</span>`).join(" · ")}</div>`:""}</div>`+
 T.map(x=>{const loop=x.reasoning_zlib!=null&&x.reasoning_zlib<0.10&&(x.assistant_n_tokens||0)>=1000;const p=P[x.k]||{};
  const flags=(loop?'<span class="badge b-bad">repetitive</span>':"")+(x.cls==="near"?'<span class="badge b-warn">near-loop</span>':"")+(x.think_closed===false?'<span class="badge b-warn">no &lt;/think&gt;</span>':"")+(x.is_invalid_tool_call?'<span class="badge b-warn">invalid tool call</span>':"")+(x.has_malformed_thinking?'<span class="badge b-warn">malformed thinking</span>':"")+(x.calls.length===0?'<span class="badge b-grey">no tool call</span>':"")+(x.deep_tokens>0?`<span class="badge" style="background:#4a3aa7">deep ${num(x.deep_tokens)} tok</span>`:"");
  const met=x.turn_contrib!=null||x.close_p_tr!=null?`<span class=small>contrib ${signed(x.turn_contrib)} · 1−p deep ${x.mean_1mp_deep!=null?x.mean_1mp_deep.toFixed(3):"–"} · p(&lt;/think&gt;) ${x.close_p_tr!=null?fmtN(x.close_p_tr):"–"}</span>`:"";
  return `<div class="card${x.deep_tokens>0?" deep":""}" id="turn-${x.k}"><div class=hd onclick="this.parentNode.classList.toggle('open')"><b>turn ${x.k+1}</b><span class=bar style="width:${Math.max(2,160*(x.assistant_n_tokens||0)/mx)}px"></span><span class=mono>${num(x.assistant_n_tokens)} gen tok</span><span class=small>prompt ${num(x.prompt_tokens)} tok · cache ${num(x.cache_read_tokens)} · tool out ${num(x.user_n_tokens)} tok · ${x.latency!=null?x.latency.toFixed(1)+" s":""}</span><span>${x.calls.map(c=>`<span class="badge b-blue">${esc(c.name)}</span>`).join("")}</span><span class=small>think ${num(x.reasoning_len)} chars${x.reasoning_zlib!=null?" · zlib "+x.reasoning_zlib.toFixed(2):""}</span>${met}${flags}</div>
  <div class=bd><h3>reasoning</h3><pre>${esc(x.reasoning)}${x.reasoning_len>x.reasoning.length?`\n… (${num(x.reasoning_len-x.reasoning.length)} more chars)`:""}</pre>${x.reasoning_len>x.reasoning.length&&p.reasoning?valueLink(p.reasoning,"show full reasoning"):""}
  ${x.message&&x.message.trim()?`<h3>message text</h3><pre>${esc(x.message)}</pre>`:""}
  ${x.calls.map((c,ci)=>`<h3>tool call: ${esc(c.name)}</h3><pre>${esc(prettyArgs(c.arguments))}${c.arguments_len>c.arguments.length?"\n… (truncated)":""}</pre>${c.arguments_len>c.arguments.length&&p.arguments?valueLink(p.arguments,"show full arguments"):""}`).join("")}
  ${x.outputs.map(o=>`<h3>tool output <span class=small>(${num(o.output_len)} chars)</span></h3><pre>${esc(o.output)}${o.output_len>o.output.length?`\n… (${num(o.output_len-o.output.length)} more chars)`:""}</pre>${o.output_len>o.output.length&&p.output?valueLink(p.output,"show full output"):""}`).join("")}
  <div class=small style="margin-top:6px">raw strings: ${p.generation_str?valueLink(p.generation_str,`generation_str (${num(x.generation_len)} chars${x.generation_zlib!=null?", zlib "+x.generation_zlib.toFixed(2):""})`):""} ${p.prompt_str?valueLink(p.prompt_str,`prompt_str as sent to the engine (${fmtB(x.prompt_str_len||0)})`):""}</div></div></div>`}).join("")}
function openTurn(e,k){e.preventDefault();const c=document.getElementById("turn-"+k);if(c){c.classList.add("open");c.scrollIntoView({behavior:"smooth",block:"start"})}}
function prettyArgs(a){try{return JSON.stringify(JSON.parse(a),null,1)}catch(e){return a}}
function tabProblem(t){const r=cur.rec;const pm=r.prompt_metadata||{};const fr=r.full_result||{};
 t.innerHTML=`<h3>problem statement <span class=small>${esc(pm.instance_id)} · ${esc(pm.repo)}</span></h3>${strBlock(pm.problem_statement,"prompt_metadata.problem_statement")}
 <h3>model patch ${fr.patch_exists===false?'<span class="badge b-grey">none</span>':""}</h3>${strBlock(fr.model_patch,"full_result.model_patch")}
 <h3>user prompt (prompt_input[1])</h3>${strBlock(((r.prompt_input||[])[1]||{}).content,"prompt_input.1.content")}
 <h3>system prompt (prompt_input[0])</h3>${strBlock(((r.prompt_input||[])[0]||{}).content,"prompt_input.0.content")}`}
function strBlock(v,path){if(v==null)return "<pre></pre>";if(typeof v==="object"&&v.__elided__)return `<pre>${esc(v.head)}\n… (${num(v.len)} chars total)</pre>${valueLink(v.path,"show full")}`;return `<pre>${esc(v)}</pre>`}
function tabFields(t){t.innerHTML=`<p class=small>Strings longer than 20,000 chars are elided; click "load" to fetch them. Values under keys named like api_key/password/secret are redacted by the server.</p><div class=tree>${tree(cur.rec,"",0)}</div>`}
function tree(v,path,depth){if(v&&typeof v==="object"&&v.__elided__)return `<span class=s>"${esc(v.head.slice(0,300))}…"</span> <span class=small>(${num(v.len)} chars)</span> ${valueLink(v.path,"load")}`;
 if(Array.isArray(v)){if(!v.length)return "[]";const open=depth<1;return `<span class=t onclick="tg(this)">${open?"▾":"▸"}</span> <span class=small>[${v.length}]</span><ul style="display:${open?"block":"none"}">${v.map((x,i)=>`<li><span class=k>${i}</span>: ${tree(x,path+"."+i,depth+1)}</li>`).join("")}</ul>`}
 if(v&&typeof v==="object"){const ks=Object.keys(v);if(!ks.length)return "{}";const open=depth<2&&ks.length<60;return `<span class=t onclick="tg(this)">${open?"▾":"▸"}</span> <span class=small>{${ks.length}}</span><ul style="display:${open?"block":"none"}">${ks.map(k=>`<li><span class=k>${esc(k)}</span>: ${tree(v[k],path?path+"."+k:k,depth+1)}</li>`).join("")}</ul>`}
 if(typeof v==="string"){if(v.length>400)return `<span class=s>"${esc(v.slice(0,400))}…"</span> <span class=t onclick="this.previousElementSibling.textContent=JSON.stringify(this.dataset.v);this.remove()" data-v="${esc(v)}">[+${num(v.length-400)} chars]</span>`;return `<span class=s>${esc(JSON.stringify(v))}</span>`}
 if(typeof v==="number")return `<span class=n>${v}</span>`;return `<span>${esc(JSON.stringify(v))}</span>`}
function tg(el){const ul=el.parentNode.querySelector("ul");if(!ul)return;const open=ul.style.display!=="none";ul.style.display=open?"none":"block";el.textContent=open?"▸":"▾"}
async function tabGroup(t){const d=await api("/api/group",{run:cur.run,file:cur.file,group_id:cur.rec.group_id});const rows=d.rows;const g=d.group;
 t.innerHTML=`<p class=small>All rollouts in this file with group_id ${esc(cur.rec.group_id)} (same prompt, GRPO group). Rewards: ${rows.filter(r=>r.reward>0).length} of ${rows.length} positive.${d.has_metrics?(g?`<br><b>Group R_deep:</b> net ${signed(g.group_net_contrib)} = pos ${fmtN(g.group_pos_contrib)} + neg ${signed(g.group_neg_contrib)} · cancel ratio |neg|/pos ${g.group_cancel_ratio!=null?fmtN(g.group_cancel_ratio):"–"} · ${g.group_n_deep_rollouts??0} sibling(s) with a deep turn · mean reward ${g.group_mean_reward!=null?fmtN(g.group_mean_reward):"–"}${g.group_rank_net_steps1_10!=null?` · net rank over steps 1-10: #${g.group_rank_net_steps1_10}`:""}`:"<br>no trainer metrics for this group"):""}</p><table><tr><th>#</th><th>comp</th><th>reward</th><th>trunc</th><th>error</th><th>loops</th>${d.has_metrics?'<th>mask list</th><th class=num>adv</th><th class=num>R_deep contrib</th><th class=num>deep turns</th><th class=num>1−p deep</th>':""}<th class=num>turns</th><th class=num>gen tokens</th><th class=num>total tokens</th><th>wv</th></tr>`+
 rows.sort((a,b)=>(a.completion_index??0)-(b.completion_index??0)).map(r=>`<tr class=click onclick="location.hash='#/run/${encodeURIComponent(cur.run)}/file/${encodeURIComponent(cur.file)}/rec/${r.i}'" ${r.i===cur.i?'style="font-weight:700"':""}><td class=num>${r.i}</td><td class=num>${num(r.completion_index)}</td><td>${badges({reward:r.reward})}</td><td>${r.truncated?'<span class="badge b-warn">yes</span>':""}</td><td>${esc(r.agent_error_kind||"")}</td><td>${loopBadge(r)}</td>${d.has_metrics?`<td>${maskBadge(r)}</td><td class=num>${fmtN(r.adv)}</td><td class=num>${signed(r.r_deep_contrib)}</td><td class=num>${r.n_deep_turns||""}</td><td class=num>${r.mean_1mp_deep!=null?r.mean_1mp_deep.toFixed(3):""}</td>`:""}<td class=num>${num(r.num_assistant_turns)}</td><td class=num>${num(r.generation_length)}</td><td class=num>${num(r.total_tokens)}</td><td class=num>${num(r.start_weight_version)}→${num(r.end_weight_version)}</td></tr>`).join("")+"</table>"}
function tabRaw(t){t.innerHTML=`<p class=small>Record with long strings elided (full raw JSON: <a href="/api/raw?run=${encodeURIComponent(cur.run)}&file=${encodeURIComponent(cur.file)}&i=${cur.i}">download</a>).</p><pre>${esc(JSON.stringify(cur.rec,null,1))}</pre>`}
async function viewSearch(q){crumbs([["runs","#/"],["search: "+q]]);$("#search").value=q;const rows=await api("/api/search",{q});
 $("#main").innerHTML=`<h2>search "${esc(q)}" — ${rows.length} rollouts in indexed files</h2><table><tr><th>run</th><th>file</th><th>#</th><th>instance</th><th>sample</th><th>reward</th><th>trunc</th><th>error</th><th>loops</th><th class=num>turns</th><th class=num>gen tokens</th></tr>`+
 rows.map(r=>`<tr class=click onclick="location.hash='#/run/${encodeURIComponent(r.run)}/file/${encodeURIComponent(r.file)}/rec/${r.i}'"><td class=mono>${esc(r.run)}</td><td class=mono>${esc(r.file)}</td><td class=num>${r.i}</td><td class=mono>${esc(r.instance_id)}</td><td class=mono>${esc((r.sample_id||"").slice(-6))}</td><td>${badges({reward:r.reward})}</td><td>${r.truncated?"yes":""}</td><td>${esc(r.agent_error_kind||"")}</td><td>${loopBadge(r)}</td><td class=num>${num(r.num_assistant_turns)}</td><td class=num>${num(r.generation_length)}</td></tr>`).join("")+"</table>"}
</script></body></html>
